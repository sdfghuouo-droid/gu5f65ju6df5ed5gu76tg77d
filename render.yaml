databases:
  - name: clouddesk-db
    databaseName: clouddesk
    user: clouddesk
    plan: free
    region: frankfurt

services:
  - type: web
    name: clouddesk-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: clouddesk
    healthCheckPath: /api/healthz
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/db run push-force && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clouddesk-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: AUTH_USER
        value: admin
      - key: AUTH_PASSWORD_HASH
        value: e2186dbdb1bb4193608605e84f33208765b5693b55edd4f730a719a100eeea6f
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sdfghuouo-droid.github.io,https://1276552c-100d-487b-9e7a-c8e6d50b08f8-00-10u49w75zs3uv.janeway.replit.dev